<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>অ্যাডমিন প্যানেল</title>
<meta name="theme-color" content="#0F172A">
<style>
:root{--bg:#F1F5F9;--card:#fff;--soft:#F8FAFC;--text:#0F172A;--muted:#64748B;--line:#E2E8F0;--accent:#0F6E56;--accentbg:#E1F5EE;--dark:#0F172A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;font-size:14px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;outline:0}
input{font:inherit}
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 20px;text-align:center}
.lbox h1{margin:0 0 4px;font-size:20px}
.lbox p{margin:0 0 14px;color:var(--muted);font-size:13px}
.lbox input{width:100%;height:48px;padding:0 14px;border:1px solid #CBD5E1;border-radius:12px;background:var(--soft);font-size:16px;margin-top:10px}
.btn{width:100%;height:48px;border:0;border-radius:12px;font-size:15px;font-weight:700;margin-top:12px;background:var(--dark);color:#fff}
.btn.g{background:#fff;color:var(--text);border:1px solid #CBD5E1;display:flex;align-items:center;justify-content:center;gap:10px}
.msg{min-height:18px;margin-top:10px;font-size:13px;color:#B42318}
#app{display:none;max-width:560px;margin:0 auto;padding:12px 12px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top h1{font-size:17px;margin:0}
.top small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.lo{background:#fff;border:1px solid #F0B4B4;color:#A32D2D;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sum b{display:block;font-size:22px;color:var(--accent)}
.sum span{font-size:12px;color:var(--muted)}
.mem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--accentbg);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.mi{flex:1;min-width:0}
.mi b{display:block;font-size:14px}
.mi span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:18px;font-weight:700}
.cnt small{font-size:11px;color:var(--muted);font-weight:500}
.ref{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px}
.sw{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sw b{font-size:14px}
.sw span{display:block;font-size:12px;color:var(--muted)}
.tgl{position:relative;width:52px;height:30px;border-radius:15px;border:0;background:#CBD5E1;transition:background .15s;flex:none}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tgl.on{background:var(--accent)}
.tgl.on::after{transform:translateX(22px)}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.im{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px}
.im img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;background:#E2E8F0}
.im .n{font-size:12px;color:var(--muted);margin:6px 0 4px;text-align:center}
.im .r{display:flex;gap:6px}
.im .r button{flex:1;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px}
.im .r .d{background:#EF4444;border:0;display:flex;align-items:center;justify-content:center}
.up{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;margin-top:12px;position:relative;overflow:hidden}
.up input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.ok{color:var(--accent)}
</style>
</head>
<body>

<div id="login"><div class="lbox">
<h1>🔒 অ্যাডমিন প্যানেল</h1>
<p>শুধু অ্যাডমিনের জন্য</p>
<input type="email" id="lemail" placeholder="জিমেইল" autocomplete="username" autocapitalize="none" spellcheck="false">
<input type="password" id="lpass" placeholder="পাসওয়ার্ড" autocomplete="current-password">
<button class="btn" id="ebtn" type="button">লগ ইন</button>
<button class="btn g" id="gbtn" type="button"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg> Google দিয়ে লগ ইন</button>
<div class="msg" id="lmsg"></div>
</div></div>

<div id="app">
<div class="top"><h1>⚙ অ্যাডমিন প্যানেল<small id="who"></small></h1><button class="lo" id="logout" type="button">লগ আউট</button></div>

<div class="card">
<h2>👥 সদস্যদের নাম্বার</h2>
<div class="sum"><div><b id="tm">–</b><span>মোট সদস্য</span></div><div><b id="tn">–</b><span>মোট নাম্বার</span></div></div>
<div id="mems" style="margin-top:6px"></div>
<button class="ref" id="rf" type="button" style="margin-top:8px">🔄 নতুন করে আনুন</button>
</div>

<div class="card">
<h2>🖼 পোস্টার</h2>
<div class="sw"><div><b>পোস্টার দেখানো</b><span id="swt">–</span></div><button class="tgl" id="tgl" type="button" aria-label="পোস্টার চালু বা বন্ধ"></button></div>
<div class="imgs" id="imgs"></div>
<label class="up" id="upl">➕ ছবি যোগ করুন<input type="file" id="file" accept="image/*" multiple></label>
<div class="msg ok" id="pmsg"></div>
<div class="hint">ছবিগুলো যে ক্রমে আছে সে ক্রমেই আসবে, ◀ ▶ দিয়ে ক্রম বদলান। এখান থেকে কোনো ছবি না থাকলে ফোল্ডারের poster1, poster2, poster3 ছবি দেখাবে।</div>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getStorage,ref,uploadBytes,getDownloadURL,deleteObject}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig={
  apiKey:"AIzaSyA5xbN9TkQnEj2Ec2OVxCrG46H_1kvbK4I",
  authDomain:"faheem-khan-7f94f.firebaseapp.com",
  projectId:"faheem-khan-7f94f",
  storageBucket:"faheem-khan-7f94f.firebasestorage.app",
  messagingSenderId:"934253739357",
  appId:"1:934253739357:web:2e3126885b652cbc5efcb4"
};

/* ====== এখানে নিজের অ্যাডমিন জিমেইল বসান ====== */
const ADMIN_EMAILS=["rifat018459073211@gmail.com"];
const ADMIN_UIDS=["F0gz8Wf4X8UocrBERzSrL5SYxtA3"];

/* সদস্যদের তালিকা (id = ডেটাবেসের ডকুমেন্টের নাম) */
const MEMBERS=[
  {id:"fahim",  name:"ফাহিম খান",  mail:"9w.fahimkhan@gmail.com"},
  {id:"user2",  name:"হিমেল শেখ",  mail:"himelsheikh.9w@gmail.com"},
  {id:"user4",  name:"রাফসান খান", mail:"rafsankhan.9w@gmail.com"},
  {id:"faardin",name:"ফারদিন খান", mail:"faardinkhaan999@gmail.com"}
];

const app=initializeApp(firebaseConfig);
const auth=getAuth(app),db=getFirestore(app),st=getStorage(app);
const $=id=>document.getElementById(id);
const DEL='<svg viewBox="0 0 24 24" width="17" height="17" fill="#fff"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
const CFG=doc(db,"config","poster");
let cfg={enabled:true,images:[]};

/* ---------- লগ ইন ---------- */
async function emailLogin(){
  $("lmsg").textContent="";
  const em=$("lemail").value.trim(),pw=$("lpass").value;
  if(!em||!pw){$("lmsg").textContent="জিমেইল আর পাসওয়ার্ড দুটোই দিন";return}
  try{await signInWithEmailAndPassword(auth,em,pw)}catch(e){$("lmsg").textContent="লগ ইন করা যায়নি: "+(e.code||e.message)}
}
$("ebtn").onclick=emailLogin;
$("lpass").addEventListener("keydown",e=>{if(e.key==="Enter")emailLogin()});
$("gbtn").onclick=async()=>{
  $("lmsg").textContent="";
  const p=new GoogleAuthProvider();
  try{await signInWithPopup(auth,p)}catch(e){try{await signInWithRedirect(auth,p)}catch(x){$("lmsg").textContent="Google দিয়ে লগ ইন করা যায়নি: "+(x.code||x.message)}}
};
$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
  if(!user){$("app").style.display="none";$("login").style.display="flex";return}
  const em=(user.email||"").toLowerCase();
  const ok=ADMIN_UIDS.includes(user.uid)||ADMIN_EMAILS.map(x=>x.toLowerCase()).includes(em);
  if(!ok){
    $("app").style.display="none";$("login").style.display="flex";
    $("lmsg").textContent="এই অ্যাকাউন্টের অ্যাডমিন অনুমতি নেই";
    await signOut(auth);return;
  }
  $("login").style.display="none";$("app").style.display="block";
  $("who").textContent=user.email;
  loadMembers();loadPoster();
});

/* ---------- সদস্য ---------- */
async function loadMembers(){
  $("mems").innerHTML='<div class="hint">লোড হচ্ছে…</div>';
  let total=0,h="";
  for(const m of MEMBERS){
    let c=null;
    try{const s=await getDoc(doc(db,"data",m.id));c=s.exists()?(s.data().nums||[]).length:0}catch(e){c=null}
    if(c!==null)total+=c;
    h+='<div class="mem"><div class="av">'+m.name.charAt(0)+'</div><div class="mi"><b>'+m.name+'</b><span>'+m.mail+'</span></div><div class="cnt">'+(c===null?"–":c)+' <small>টা</small></div></div>';
  }
  $("mems").innerHTML=h;
  $("tm").textContent=MEMBERS.length;
  $("tn").textContent=total;
}
$("rf").onclick=loadMembers;

/* ---------- পোস্টার ---------- */
async function loadPoster(){
  try{
    const s=await getDoc(CFG);
    if(s.exists()){const d=s.data();cfg={enabled:d.enabled!==false,images:Array.isArray(d.images)?d.images:[]}}
  }catch(e){$("pmsg").textContent="পোস্টারের তথ্য পড়া যায়নি: "+(e.code||e.message)}
  drawPoster();
}
async function saveCfg(){
  try{await setDoc(CFG,{enabled:cfg.enabled,images:cfg.images},{merge:true});$("pmsg").className="msg ok";$("pmsg").textContent="সেভ হয়েছে ✓"}
  catch(e){$("pmsg").className="msg";$("pmsg").textContent="সেভ করা যায়নি: "+(e.code||e.message)}
}
function drawPoster(){
  $("tgl").classList.toggle("on",cfg.enabled);
  $("swt").textContent=cfg.enabled?"চালু আছে, অ্যাপ খুললে আসবে":"বন্ধ আছে, কারও কাছে আসবে না";
  $("imgs").innerHTML=cfg.images.map((x,i)=>'<div class="im"><img src="'+x.url+'" alt=""><div class="n">ছবি '+(i+1)+'</div><div class="r"><button data-a="l" data-i="'+i+'" type="button">◀</button><button data-a="r" data-i="'+i+'" type="button">▶</button><button class="d" data-a="d" data-i="'+i+'" type="button">'+DEL+'</button></div></div>').join("");
}
$("tgl").onclick=async()=>{cfg.enabled=!cfg.enabled;drawPoster();await saveCfg()};
$("imgs").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const i=+b.dataset.i,a=b.dataset.a;
  if(a==="l"&&i>0){[cfg.images[i-1],cfg.images[i]]=[cfg.images[i],cfg.images[i-1]]}
  else if(a==="r"&&i<cfg.images.length-1){[cfg.images[i+1],cfg.images[i]]=[cfg.images[i],cfg.images[i+1]]}
  else if(a==="d"){
    if(!confirm("এই ছবিটা মুছে ফেলবেন?"))return;
    const x=cfg.images[i];
    try{if(x.path)await deleteObject(ref(st,x.path))}catch(err){}
    cfg.images.splice(i,1);
  }else return;
  drawPoster();await saveCfg();
});

async function shrink(file){
  const bmp=await createImageBitmap(file);
  const sc=Math.min(1,1200/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");
  c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  const x=c.getContext("2d");
  const png=file.type==="image/png";
  if(!png){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}
  x.drawImage(bmp,0,0,c.width,c.height);
  const type=png?"image/png":"image/jpeg";
  const blob=await new Promise(r=>c.toBlob(r,type,.88));
  return{blob,type,ext:png?"png":"jpg"};
}
$("file").onchange=async e=>{
  const files=[...e.target.files];if(!files.length)return;
  $("pmsg").className="msg ok";
  let done=0;
  for(const f of files){
    $("pmsg").textContent="আপলোড হচ্ছে… "+(done+1)+"/"+files.length;
    try{
      const s=await shrink(f);
      const path="posters/"+Date.now()+"_"+done+"."+s.ext;
      await uploadBytes(ref(st,path),s.blob,{contentType:s.type});
      const url=await getDownloadURL(ref(st,path));
      cfg.images.push({url,path});
      done++;
    }catch(err){
      $("pmsg").className="msg";$("pmsg").textContent="আপলোড হয়নি: "+(err.code||err.message);
      break;
    }
  }
  e.target.value="";
  drawPoster();
  if(done)await saveCfg();
};
</script>
</body>
