<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অ্যাডমিন প্যানেল</title>
<meta name="theme-color" content="#0F6E56">
<style>
:root{--bg:#F1F5F9;--card:#fff;--soft:#F8FAFC;--text:#0F172A;--muted:#64748B;--line:#E2E8F0;--ac:#0F6E56;--onac:#fff;--acbg:#E1F5EE;--wn:#B45309;--wnbg:#FEF3C7;--bd:#B42318;--bdbg:#FEE4E2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#131C2E;--soft:#18233A;--text:#E8EEF8;--muted:#93A1B8;--line:#26334D;--ac:#34C79F;--onac:#06251D;--acbg:#0E2F28;--wn:#FBBF24;--wnbg:#3A2A08;--bd:#F97066;--bdbg:#3B1512;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#131C2E;--soft:#18233A;--text:#E8EEF8;--muted:#93A1B8;--line:#26334D;--ac:#34C79F;--onac:#06251D;--acbg:#0E2F28;--wn:#FBBF24;--wnbg:#3A2A08;--bd:#F97066;--bdbg:#3B1512;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Noto Sans Bengali",sans-serif;overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}
#login{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:#0F6E56;overflow-y:auto}
.hero{flex:none;color:#fff;text-align:center;padding:44px 24px 30px}
.logo{width:72px;height:72px;margin:0 auto 14px;border-radius:22px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:34px}
.hero h1{margin:0 0 6px;font-size:23px}
.hero p{margin:0;opacity:.85;font-size:13px}
.sheet{flex:1;background:var(--card);border-radius:28px 28px 0 0;padding:26px 22px 28px}
.form{max-width:380px;margin:0 auto}
.form h2{margin:0 0 16px;font-size:19px}
.form label{display:block;margin:12px 0 6px;font-weight:700;font-size:13px;color:var(--muted)}
.form input{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--text);font-size:16px}
.btn{width:100%;height:48px;margin-top:14px;border:0;border-radius:12px;background:var(--ac);color:var(--onac);font-weight:700;font-size:16px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-weight:600;font-size:15px}
.or{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.note{margin:18px 0 0;text-align:center;font-size:12px;color:var(--muted);line-height:1.6}
#app{display:none;height:100%;flex-direction:column}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:16px}
.top button{border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:10px;padding:6px 12px;font-size:12px}
.demo{flex:none;background:var(--wnbg);color:var(--wn);text-align:center;font-size:12px;font-weight:700;padding:5px 8px}
#main{flex:1;min-height:0;overflow-y:auto;padding:14px 12px 20px}
.wrap{max-width:560px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.m b{display:block;font-size:20px}
.m span{font-size:11px;color:var(--muted)}
.sec{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.u{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.u.s-approved{border-left-color:var(--ac)}.u.s-pending{border-left-color:var(--wn)}.u.s-rejected{border-left-color:var(--bd)}
.av{width:40px;height:40px;border-radius:50%;background:var(--acbg);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.nc{flex:1;min-width:0}
.nc b{display:block;font-size:15px}
.nc span{font-size:12px;color:var(--muted)}
.bg{border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.bg.ok{background:var(--acbg);color:var(--ac)}.bg.wn{background:var(--wnbg);color:var(--wn)}.bg.bd{background:var(--bdbg);color:var(--bd)}.bg.gr{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.back{border:0;background:none;color:var(--ac);font-weight:700;font-size:14px;padding:4px 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.box h3{margin:0 0 10px;font-size:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g3 div{background:var(--soft);border-radius:10px;padding:8px 4px;text-align:center}
.g3 b{display:block;font-size:17px}.g3 span{font-size:11px;color:var(--muted)}
.li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;letter-spacing:.3px}
.li:last-child{border-bottom:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sw{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw.on{background:var(--ac)}.sw.on::after{transform:translateX(20px)}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;font-size:13px}
.chips button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.trx{font-size:16px;font-weight:700;letter-spacing:1px;margin:6px 0 2px;word-break:break-all}
.meta{font-size:12px;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;height:40px;border-radius:10px;border:0;font-weight:700}
.acts .y{background:var(--ac);color:var(--onac)}.acts .n{background:var(--bdbg);color:var(--bd)}
.empty{text-align:center;color:var(--muted);padding:28px 0}
.nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px}
.nav button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;border-radius:10px}
.nav button i{font-style:normal;font-size:20px;line-height:1.2}
.nav button.on{background:var(--acbg);color:var(--ac);font-weight:700}
</style>
</head>
<body>
<div id="login">
<div class="hero"><div class="logo">🛡️</div><h1>অ্যাডমিন প্যানেল</h1><p>ইউজার, পেমেন্ট আর বিজ্ঞাপন নিয়ন্ত্রণ</p></div>
<div class="sheet"><div class="form">
<h2>অ্যাডমিন লগ ইন</h2>
<label for="em">জিমেইল</label><input id="em" type="email" placeholder="admin@gmail.com" autocomplete="off">
<label for="pw">পাসওয়ার্ড</label><input id="pw" type="password" placeholder="পাসওয়ার্ড" autocomplete="off">
<button class="btn" id="eb" type="button">লগ ইন</button>
<div class="or"><span>অথবা</span></div>
<button class="gbtn" id="gb" type="button"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Google দিয়ে লগ ইন</button>
<div id="lmsg" style="min-height:18px;margin-top:10px;font-size:13px;color:var(--bd)"></div><p class="note">শুধু অ্যাডমিন লগ ইন করতে পারবে।</p>
</div></div>
</div>

<div id="app">
<header class="top"><h1>🛡️ অ্যাডমিন</h1><button id="lo" type="button">লগ আউট</button></header>
<div class="demo" id="demo" style="display:none"></div>
<main id="main"></main>
<nav class="nav" id="nav">
<button type="button" data-t="home" class="on"><i>🏠</i>হোম</button>
<button type="button" data-t="pay"><i>💳</i>পেমেন্ট</button>
<button type="button" data-t="ads"><i>📢</i>বিজ্ঞাপন</button>
</nav>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,collection,onSnapshot,setDoc,updateDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const fbApp=initializeApp({
  apiKey:"AIzaSyA5xbN9TkQnEj2Ec2OVxCrG46H_1kvbK4I",
  authDomain:"faheem-khan-7f94f.firebaseapp.com",
  projectId:"faheem-khan-7f94f",
  storageBucket:"faheem-khan-7f94f.firebasestorage.app",
  messagingSenderId:"934253739357",
  appId:"1:934253739357:web:2e3126885b652cbc5efcb4"
});
const auth=getAuth(fbApp),db=getFirestore(fbApp);
const ADMIN_UID="F0gz8Wf4X8UocrBERzSrL5SYxtA3",ADMIN_EMAIL="rifat018459073211@gmail.com";
const USERS={"Q9dErcUg8dN1A2c3jjSYSJFNH0n1":"fahim","qqGBet1h6oXdvkAlFH6w54QXsDA2":"user2","XGEzalexFaR7k1ugLYILDLVaN2i2":"user4","6IRedEK97TcuaonL7CL84wACiHm2":"faardin"};
const $=s=>document.querySelector(s);
const U=Object.entries(USERS).map(([uid,id])=>({uid,id,nums:[],ticks:null,n:0,used:0,wa:0,imo:0,none:0,saved:[],pay:null,ad:true}));
let tab="home",openId=null,pf="all",unsubs=[];
const fail=e=>{const d=$("#demo");d.style.display="block";d.textContent="ডেটা পড়া যায়নি: "+(e.code||e.message)+" (রুলস Publish করেছেন?)"};
function recalc(u){
  const T=u.ticks||{},ns=new Set(u.nums);
  const any=(...ks)=>new Set(ks.flatMap(k=>(T[k]||[]).filter(x=>ns.has(x)))).size;
  u.n=u.nums.length;u.saved=u.nums.slice(0,30);
  u.used=any("c");u.wa=any("w","m1w","m1b","m2b");u.imo=any("i","m1i","m2i");u.none=any("none");
}
const ST={approved:["পেইড","ok"],pending:["অপেক্ষায়","wn"],rejected:["বাতিল","bd"],none:["পেমেন্ট নেই","gr"]};
const stOf=u=>u.pay?u.pay.st:"none";
const bdg=u=>{const[t,c]=ST[stOf(u)];return '<span class="bg '+c+'">'+t+'</span>'};
const sw=(id,on)=>'<button class="sw'+(on?' on':'')+'" role="switch" aria-checked="'+on+'" data-ad="'+id+'"></button>';
function home(){
  const paid=U.filter(u=>stOf(u)==="approved").length,wait=U.filter(u=>stOf(u)==="pending").length;
  return '<div class="wrap"><div class="stats"><div class="m"><b>'+U.length+'</b><span>মোট ইউজার</span></div><div class="m"><b>'+paid+'</b><span>পেমেন্ট দিয়েছে</span></div><div class="m"><b>'+wait+'</b><span>অপেক্ষায়</span></div></div><p class="sec">সব ইউজার, চাপ দিলে বিস্তারিত দেখুন</p>'+
  U.map(u=>'<button class="u s-'+stOf(u)+'" data-id="'+u.id+'"><span class="av">'+u.id[0].toUpperCase()+'</span><span class="nc"><b>'+u.id+'</b><span>'+u.n+'টা নাম্বার, ব্যবহৃত '+u.used+'</span></span>'+bdg(u)+'</button>').join("")+'</div>';
}
function detail(){
  const u=U.find(x=>x.id===openId);
  return '<div class="wrap"><button class="back" data-back="1">‹ সব ইউজার</button>'+
  '<div class="box"><div class="row"><div style="display:flex;gap:10px;align-items:center"><span class="av">'+u.id[0].toUpperCase()+'</span><b style="font-size:17px">'+u.id+'</b></div>'+bdg(u)+'</div></div>'+
  '<div class="box"><h3>অ্যাপের তথ্য</h3>'+(u.ticks?'':'<div class="meta" style="margin-bottom:8px">ইউজারের অ্যাপ আপডেট হলে ব্যবহৃত, WhatsApp, imo-র হিসাব আসবে</div>')+'<div class="g3"><div><b>'+u.n+'</b><span>মোট নাম্বার</span></div><div><b>'+u.used+'</b><span>ব্যবহৃত</span></div><div><b>'+(u.n-u.used)+'</b><span>বাকি</span></div><div><b>'+u.wa+'</b><span>WhatsApp</span></div><div><b>'+u.imo+'</b><span>imo</span></div><div><b>'+u.none+'</b><span>কিছুই পাইনি</span></div></div></div>'+
  '<div class="box"><h3>সেভ করা নাম্বার</h3>'+u.saved.map(s=>'<div class="li">'+s+'</div>').join("")+'<div class="meta" style="margin-top:8px">আরও '+Math.max(u.n-u.saved.length,0)+'টা আছে</div></div>'+
  '<div class="box"><h3>পেমেন্ট</h3>'+(u.pay?'<div class="trx">'+u.pay.trx+'</div><div class="meta">'+u.pay.amt+' টাকা, '+u.pay.t+'</div>'+(u.pay.st==="pending"?'<div class="acts"><button class="y" data-ap="'+u.id+'">অ্যাপ্রুভ</button><button class="n" data-rj="'+u.id+'">রিজেক্ট</button></div>':''):'<div class="meta">এখনো পেমেন্ট করেনি</div>')+'</div>'+
  '<div class="box row"><div><b>বিজ্ঞাপন দেখাবে</b><span>বন্ধ করলে এই ইউজার পোস্টার দেখবে না</span></div>'+sw(u.id,u.ad)+'</div></div>';
}
function pay(){
  const L=U.filter(u=>u.pay&&(pf==="all"||u.pay.st===pf));
  const chip=(k,t)=>'<button data-f="'+k+'" class="'+(pf===k?'on':'')+'">'+t+'</button>';
  return '<div class="wrap"><div class="chips">'+chip("all","সব")+chip("pending","অপেক্ষায়")+chip("approved","নিশ্চিত")+chip("rejected","বাতিল")+'</div>'+
  (L.length?L.map(u=>'<div class="pc"><div class="row"><b>'+u.id+'</b>'+bdg(u)+'</div><div class="trx">'+u.pay.trx+'</div><div class="meta">'+u.pay.amt+' টাকা, '+u.pay.t+'</div>'+(u.pay.st==="pending"?'<div class="acts"><button class="y" data-ap="'+u.id+'">অ্যাপ্রুভ</button><button class="n" data-rj="'+u.id+'">রিজেক্ট</button></div>':'')+'</div>').join(""):'<div class="empty">এই তালিকায় কিছু নেই</div>')+'</div>';
}
function ads(){
  return '<div class="wrap"><p class="sec">পেমেন্টের পর যার বিজ্ঞাপন বন্ধ করতে চান, তার সুইচ বন্ধ করুন</p>'+
  U.map(u=>'<div class="box row" style="margin-bottom:10px"><div><b>'+u.id+'</b><span>'+(u.ad?'বিজ্ঞাপন দেখছে':'বিজ্ঞাপন বন্ধ')+'</span></div>'+sw(u.id,u.ad)+'</div>').join("")+'</div>';
}
function render(top){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  const m=$("#main");
  m.innerHTML=tab==="home"?(openId?detail():home()):tab==="pay"?pay():ads();
  if(top)m.scrollTop=0;
}

$("#main").addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  try{
    if(d.id){openId=d.id;render(true);return}
    if(d.back){openId=null;render(true);return}
    if(d.f){pf=d.f;render();return}
    if(d.ad){const u=U.find(x=>x.id===d.ad);await setDoc(doc(db,"access",u.uid),{adOff:u.ad},{merge:true});return}
    if(d.ap){const u=U.find(x=>x.id===d.ap);await updateDoc(doc(db,"payments",u.uid),{status:"approved",reviewedAt:Date.now()});await setDoc(doc(db,"access",u.uid),{adOff:true},{merge:true});return}
    if(d.rj){const u=U.find(x=>x.id===d.rj);await updateDoc(doc(db,"payments",u.uid),{status:"rejected",reviewedAt:Date.now()});return}
  }catch(x){alert("সেভ হয়নি: "+(x.code||x.message))}
});
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button[data-t]");if(!b)return;tab=b.dataset.t;openId=null;render(true)});

function stop(){unsubs.forEach(f=>f());unsubs=[]}
function start(){
  stop();
  U.forEach(u=>unsubs.push(onSnapshot(doc(db,"data",u.id),s=>{
    const d=s.exists()?s.data():{};
    u.nums=(d.nums||[]).map(String);u.ticks=d.ticks||null;recalc(u);render();
  },fail)));
  unsubs.push(onSnapshot(collection(db,"payments"),s=>{
    U.forEach(u=>u.pay=null);
    s.forEach(d=>{const u=U.find(x=>x.uid===d.id),p=d.data();
      if(u)u.pay={trx:p.trxId,st:p.status,amt:String(p.amount||"").replace(/\s*টাকা/,""),t:p.at?new Date(p.at).toLocaleString("bn-BD"):""}});
    render();
  },fail));
  unsubs.push(onSnapshot(collection(db,"access"),s=>{
    U.forEach(u=>u.ad=true);
    s.forEach(d=>{const u=U.find(x=>x.uid===d.id);if(u)u.ad=!d.data().adOff});
    render();
  },fail));
}

const isAdmin=u=>u.uid===ADMIN_UID||(u.email===ADMIN_EMAIL&&u.emailVerified);
onAuthStateChanged(auth,async u=>{
  if(!u){stop();$("#app").style.display="none";$("#login").style.display="flex";return}
  if(!isAdmin(u)){$("#lmsg").textContent="এই অ্যাকাউন্টে অ্যাডমিন অনুমতি নেই";await signOut(auth);return}
  $("#lmsg").textContent="";$("#login").style.display="none";$("#app").style.display="flex";
  start();render(true);
});
$("#eb").onclick=async()=>{
  const m=$("#lmsg");m.textContent="";
  const e=$("#em").value.trim(),p=$("#pw").value;
  if(!e||!p){m.textContent="জিমেইল আর পাসওয়ার্ড দিন";return}
  try{await signInWithEmailAndPassword(auth,e,p)}catch(x){m.textContent="লগ ইন হয়নি: "+(x.code||x.message)}
};
$("#gb").onclick=async()=>{
  const m=$("#lmsg");m.textContent="";
  const g=new GoogleAuthProvider();
  try{await signInWithPopup(auth,g)}catch(x){try{await signInWithRedirect(auth,g)}catch(y){m.textContent="Google লগ ইন হয়নি: "+(y.code||y.message)}}
};
$("#lo").onclick=()=>signOut(auth);
</script>
</body>
</html>
